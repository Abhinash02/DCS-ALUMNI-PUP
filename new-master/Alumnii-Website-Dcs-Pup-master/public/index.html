<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/images/logo.png" />
  <link rel="icon" type="image/png" href="./images/logo.png" />
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />


  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/logo.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />



  <title> DCS PUP Alumni</title>
  <script>
    // Suppress external browser extension unhandled exceptions (e.g. Codeium, Grammarly contentScript.js)
    window.addEventListener('unhandledrejection', function (e) {
      try {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('sentence') ||
          msg.includes('contentScript') ||
          msg.includes('message channel closed') ||
          msg.includes('chrome-extension://') ||
          msg.includes('A listener indicated an asynchronous response')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      } catch (err) {}
    });
    window.addEventListener('error', function (e) {
      try {
        var msg = (e && e.message) || '';
        var filename = (e && e.filename) || '';
        if (
          msg.includes('sentence') ||
          msg.includes('message channel closed') ||
          filename.includes('contentScript') ||
          filename.includes('chrome-extension://')
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      } catch (err) {}
    });
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
