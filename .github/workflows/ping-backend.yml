name: Ping Backend to Prevent Cold Start

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging backend..."
          curl --silent --show-error --fail https://dcs-alumni.vercel.app/api/health
